services:
  # ----------------------------------------------------------------------------
  # Baza de date MySQL pentru autentificare și utilizatori
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: cv-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-parola}
      MYSQL_DATABASE: cv_builder_users_db
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cv-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------------------
  # Backend Spring Boot
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./cv-builder
      dockerfile: Dockerfile
    container_name: cv-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      # Conexiune MySQL catre containerul de mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cv_builder_users_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-parola}
      # Conexiune MongoDB
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-cv-db}
      SPRING_DATA_MONGODB_URI: ${MONGODB_URI}
      SPRING_MONGODB_URI: ${MONGODB_URI}
      # Configurare AI (Groq / OpenAI)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-${OPENAI_KEY:-${AI_API_KEY:-${GROQ_API_KEY:-}}}}
      AI_API_KEY: ${AI_API_KEY:-${OPENAI_API_KEY:-${OPENAI_KEY:-${GROQ_API_KEY:-}}}}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.groq.com/openai/v1}
      AI_MODEL: ${AI_MODEL:-groq/compound}
      # Configurare JWT
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    networks:
      - cv-network

  # ----------------------------------------------------------------------------
  # Frontend React (Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cv-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - cv-network

volumes:
  mysql_data:

networks:
  cv-network:
    driver: bridge